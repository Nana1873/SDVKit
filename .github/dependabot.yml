version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns:
          - "*"
    exclude-paths:
      - "docs/examples/**"
    ignore:
      # Major upgrades change the public validation problems output.
      - dependency-name: JsonSchema.Net
        update-types:
          - "version-update:semver-major"
      # Keep aligned with the generated projects and documented 4.4.0 pin.
      - dependency-name: Pathoschild.Stardew.ModBuildConfig
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
