name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SDVKit.sln

      - name: Format
        run: dotnet format SDVKit.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SDVKit.sln -c Release --no-restore

      - name: Test
        run: dotnet test SDVKit.sln -c Release --no-build --logger "trx;LogFileName=ci.trx" --results-directory .sdvkit/test-results

      - name: Require both status-file stress tests
        shell: pwsh
        run: |
          [xml]$results = Get-Content -LiteralPath .sdvkit/test-results/ci.trx -Raw
          $required = @(
            'SdvKit.Tests.LiveLabStorageTests.EnsureDirectoriesToleratesAtomicStatusReplacementTempFiles',
            'SdvKit.Tests.StatusWriterTests.ConcurrentReaderSeesCompleteExactSnapshotsWithContractFreshness'
          )
          foreach ($name in $required) {
            $matches = @($results.TestRun.Results.UnitTestResult | Where-Object testName -EQ $name)
            if ($matches.Count -ne 1 -or $matches[0].outcome -ne 'Passed') {
              throw "Required status-file stress test did not run and pass: $name"
            }
          }

      - name: Retain status concurrency failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: status-concurrency-failures
          path: .sdvkit/test-failures/
          if-no-files-found: ignore
          include-hidden-files: true

      - name: CLI smoke
        run: .\src\SdvKit.Cli\bin\Release\net8.0\sdvkit.exe --version

      - name: Package portable Windows-x64 archive
        shell: pwsh
        run: .\scripts\package-windows-x64.ps1

      - name: Smoke-test extracted portable archive
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath .\.sdvkit\distribution -File -Filter "SDVKit-*-win-x64.zip")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable archive, found $($archives.Count)."
          }
          .\scripts\verify-windows-x64.ps1 -ArchivePath $archives[0].FullName -ExpectedDoctorStatus notFound -ExtractRoot (Join-Path $env:RUNNER_TEMP "sdvkit-portable-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")

      - name: Upload portable Windows-x64 archive
        uses: actions/upload-artifact@v4
        with:
          name: SDVKit-windows-x64
          path: |
            .sdvkit/distribution/SDVKit-*-win-x64.zip
            .sdvkit/distribution/SDVKit-*-win-x64.zip.sha256
          if-no-files-found: error
          include-hidden-files: true
