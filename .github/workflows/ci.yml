name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SDVKit.sln

      - name: Format
        run: dotnet format SDVKit.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SDVKit.sln -c Release --no-restore

      - name: Test
        run: dotnet test SDVKit.sln -c Release --no-build

      - name: CLI smoke
        run: .\src\SdvKit.Cli\bin\Release\net8.0\sdvkit.exe --version
